<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>IN-SPACe 2026 — Team 003 Live</title>
  <meta name="description" content="Live telemetry from IN-SPACe 2026 Team 003: CanSat and Payload, read-only.">
  <meta name="theme-color" content="#020408">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>

<body class="viewer">
  <header id="status-bar">
    <div class="status-left">
      <div class="logo">
        <span class="logo-icon">📡</span>
        <span class="logo-text">TEAM 003 LIVE</span>
      </div>
      <div class="status-badge" id="connection-badge"><span class="dot offline"></span><span>CONNECTING</span></div>
      <div class="status-badge fb-badge" id="firebase-badge">🔥 FIREBASE OFFLINE</div>
      <div class="team-id-display" id="team-id-display">TEAM 003</div>
    </div>
    <div class="status-center">
      <div class="flight-state" id="flight-state">PRE-FLIGHT</div>
    </div>
    <div class="status-right">
      <span class="viewer-badge">👁 VIEW ONLY</span>
      <div class="met" id="met-display">T+ 00:00:00</div>
    </div>
  </header>

  <div class="mission-bar" id="mission-bar">Waiting for the ground station to start a mission…</div>

  <nav id="page-tabs"></nav>
  <div id="pages"></div>

  <div class="console-wrap">
    <div class="card" id="card-console">
      <div class="card-header"><h2>📋 MISSION EVENTS</h2></div>
      <div id="console-output"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="core.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
